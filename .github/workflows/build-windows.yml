name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DukascopyDownloader dukascopy_downloader_v1.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DukascopyDownloader-Windows
          path: dist/DukascopyDownloader.exe
